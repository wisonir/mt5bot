<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>TradeVault — MT5Bot Auto Trading EA</title>
  
  <!-- Favicon TradeVault -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f172a'/><path d='M7 22l5-6 4 4 9-10' stroke='%2310b981' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M20 10h5v5' stroke='%2310b981' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      -webkit-overflow-scrolling: touch;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe
    id="gas-frame"
    src="https://script.google.com/macros/s/AKfycbxQa41yAJhvmfPNeXSrr9v4DJxv1bewdCgEcSyVHjVO9rjCiFLueGGEBBEQQaAKt2mwvw/exec"
    allow="clipboard-read; clipboard-write"
    allowfullscreen>
  </iframe>

  <script>
    // Fallback sinkronisasi tinggi real-time untuk iOS Safari lama & PWA mode
    function syncViewportHeight() {
      const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.height = h + 'px';
      document.body.style.height = h + 'px';
      const frame = document.getElementById('gas-frame');
      if (frame) frame.style.height = h + 'px';
    }
    window.addEventListener('resize', syncViewportHeight);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncViewportHeight);
    }
    syncViewportHeight();
  </script>

</body>
</html>
